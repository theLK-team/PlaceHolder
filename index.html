<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PlaceHolder Terminal</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000000; /* full black screen */
    color: #00ff9c;
    font-family: monospace;
    overflow: hidden;
  }

  .terminal {
    padding: 20px;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
  }

  .line {
    white-space: pre-wrap;
    margin-bottom: 6px;
  }

  .input-line {
    display: flex;
    position: absolute;
    bottom: 20px;
    width: calc(100% - 40px);
  }

  input {
    background: none;
    border: none;
    color: #00ff9c;
    font-family: monospace;
    font-size: 16px;
    outline: none;
    width: 100%;
  }

  .prompt {
    margin-right: 8px;
  }

  .dim {
    color: #666;
  }

  #output {
    padding-bottom: 60px;
  }
</style>
</head>

<body>
<div class="terminal" id="terminal">

  <div class="line">PlaceHolder Terminal v0.0.1</div>
  <div class="line dim">type "help" for stuff (or don't)</div>
  <br/>

  <div id="output"></div>

  <div class="input-line">
    <span class="prompt">user@placeholder:~$</span>
    <input id="cmd" autofocus />
  </div>

</div>

<script>
const output = document.getElementById("output");
const input = document.getElementById("cmd");

function print(text) {
  const div = document.createElement("div");
  div.className = "line";
  div.textContent = text;
  output.appendChild(div);
}
function downloadFile() {
  const url = "https://raw.githubusercontent.com/thelk-team/PlaceHolder/main/PlaceDownload.txt";

  const a = document.createElement("a");
  a.href = url;
  a.download = "Download"; // forces download name in most browsers
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  print("fetching file from repo...");
}

function runCommand(cmd) {
  print("user@placeholder:~$ " + cmd);

  switch(cmd.trim().toLowerCase()) {
    case "help":
      print("commands:");
      print("- help");
      print("- about");
      print("- download");
      print("- update");
      print("- music (broken)");
      break;

    case "about":
      print("PlaceHolder is a terminal thingy.");
      print("it tries its best.");
      break;

    case "download":
      print("initiating download...");
      downloadFile();
      print("file dropped: Download");
      break;

    case "update":
      print("checking updates...");
      print("update system not tested");
      break;

    case "music":
      print("feature removed.");
      print("no im not tobyfox");
      break;

    case "":
      break;

    default:
      print("command not found: " + cmd);
      break;
  }

  print("");
}

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    runCommand(input.value);
    input.value = "";
  }
});
</script>

</body>
</html>
